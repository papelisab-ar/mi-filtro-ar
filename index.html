<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Cargamos A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Cargamos el motor de MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- Escena configurada con una tarjeta de prueba de MindAR -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Lo que aparecerá al escanear la tarjeta objetivo -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Un cubo azul sobre la imagen escaneada -->
        <a-box position="0 0 0" material="color: #4CC3D0;" depth="0.2" height="0.5" width="0.5"></a-box>
      </a-entity>

    </a-scene>
  </body>
</html>
