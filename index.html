<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Carga A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Carga el motor de MindAR especializado en Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-hand-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-hand="handType: right;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Carga de recursos (Assets) -->
      <a-assets>
        <!-- Reemplaza mi_video.mp4 por el nombre exacto de tu video subido a GitHub -->
        <video id="videoAr" src="mi_video.mp4" preload="auto" loop="true" crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Ancla 0: Se posiciona directamente en la palma de la mano -->
      <a-entity mindar-hand-target="anchorIndex: 0">
        <!-- Plano donde se proyecta el video -->
        <a-video src="#videoAr" width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <!-- Script para iniciar la reproducción automática al detectar la mano -->
    <script>
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener("arReady", () => {
        const targetEl = document.querySelector('[mindar-hand-target]');
        const videoEl = document.querySelector('#videoAr');

        // Cuando la cámara detecta la mano, inicia el video
        targetEl.addEventListener("targetFound", () => {
          videoEl.play();
        });

        // Cuando se pierde de vista la mano, pausa el video
        targetEl.addEventListener("targetLost", () => {
          videoEl.pause();
        });
      });
    </script>
  </body>
</html>
