<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Carga A-Frame 1.3.0 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Carga MindAR con soporte de tracking de manos -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-hand-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-hand="handType: right;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="videoAr" 
          src="mi_video.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Ancla sobre la palma de la mano -->
      <a-entity mindar-hand-target="anchorIndex: 0">
        <a-video src="#videoAr" width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener("arReady", () => {
        const targetEl = document.querySelector('[mindar-hand-target]');
        const videoEl = document.querySelector('#videoAr');

        targetEl.addEventListener("targetFound", () => {
          videoEl.play();
        });

        targetEl.addEventListener("targetLost", () => {
          videoEl.pause();
        });
      });
    </script>
  </body>
</html>
